
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | UCC CampusMarket</title>
    <!--External CSS-->
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef5ef, #f8faf8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 470px;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .brand-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .ucc-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        .brand-area h2 {
            color: #245b37;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .brand-area p {
            color: #777;
            font-size: 13px;
            margin-bottom: 0;
        }

        .section-title {
            color: #245b37;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #dce5dd;
        }

        .form-control:focus {
            border-color: #34834d;
            box-shadow: 0 0 0 3px rgba(52, 131, 77, 0.12);
        }

        .btn-campus {
            background: #245b37;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-campus:hover {
            background: #194328;
            color: white;
        }

        .forgot-link {
            color: #245b37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .switch-link {
            color: #245b37;
            font-weight: 600;
            text-decoration: none;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .market-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #245b37;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }

        .market-link:hover {
            text-decoration: underline;
        }

        #authMessage {
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 27px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <!-- UCC BRANDING -->
        <div class="brand-area">

            <img
                src="logo.png"
                alt="Campus Market Logo"
                class="ucc-logo"
            >

            <h2>CampusMarket</h2>

            <p>A Student Marketplace for the UCC Community</p>

        </div>


        <!-- LOGIN SECTION -->
        <div id="loginSection">

            <h4 class="section-title">Student Login</h4>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="loginEmail" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="loginEmail"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

               <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <div class="position-relative">
                                    <input type="password" class="form-control pe-5" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                                    <button type="button" class="btn btn-link position-absolute top-50 translate-middle-y end-0 text-decoration-none pe-3" onclick="togglePassword('loginPassword', 'loginEyeIcon')">
                                        <i class="fa-solid fa-eye" id="loginEyeIcon"></i>
                                    </button>
                                </div>
                            </div>
                <div class="text-end mb-4">
                    <a href="#" id="forgotPassword" class="forgot-link">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="btn btn-campus w-100">
                    Login
                </button>

            </form>

            <p class="text-center mt-4 mb-0" style="font-size: 13px;">
                Don't have an account?
                <a href="#" id="showSignup" class="switch-link">
                    Create Account
                </a>
            </p>

        </div>


        <!-- SIGNUP SECTION -->
        <div id="signupSection" style="display: none;">

            <h4 class="section-title">Create Student Account</h4>

            <form id="signupForm">

                <div class="mb-3">
                    <label for="signupName" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="signupEmail" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="signupEmail"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                 <div class="mb-3">
                                <label for="signupPassword" class="form-label">Password</label>
                                <div class="position-relative">
                                    <input type="password" class="form-control pe-5" id="signupPassword" placeholder="At least 6 characters" minlength="6" required>
                                    <button type="button" class="btn btn-link position-absolute top-50 translate-middle-y end-0 text-decoration-none pe-3" onclick="togglePassword('signupPassword', 'signupEyeIcon')">
                                        <i class="fa-solid fa-eye" id="signupEyeIcon"></i>
                                    </button>
                                </div>
                            </div>

                <button type="submit" class="btn btn-campus w-100">
                    Create Account
                </button>

            </form>

            <p class="text-center mt-4 mb-0" style="font-size: 13px;">
                Already have an account?
                <a href="#" id="showLogin" class="switch-link">
                    Login
                </a>
            </p>

        </div>
        <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>

        <!-- AUTHENTICATION MESSAGE -->
        <div id="authMessage" class="mt-3"></div>


        


        <!-- BACK TO MARKETPLACE -->
        <a href="index.html" class="market-link">
            ← Back to Marketplace
        </a>

    </div>


    <!-- SUPABASE CONNECTION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

</body>
</html>
