
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CampusMarket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #eef5ef;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h2 {
            color: #245b37;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
        }

        .btn-campus {
            background: #245b37;
            color: white;
            padding: 12px;
            font-weight: bold;
        }

        .btn-campus:hover {
            background: #194328;
            color: white;
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <h2 class="text-center mb-2">Reset Password</h2>

        <p class="text-center text-muted mb-4">
            Enter and confirm your new CampusMarket password.
        </p>

        <form id="resetPasswordForm">

            <div class="mb-3">
                <label for="newPassword" class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    class="form-control"
                    minlength="6"
                    required
                    placeholder="Enter new password"
                >
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    minlength="6"
                    required
                    placeholder="Confirm new password"
                >
            </div>

            <button type="submit" class="btn btn-campus w-100">
                Update Password
            </button>

        </form>

        <div id="resetMessage" class="mt-3"></div>

        <p class="text-center mt-3 mb-0">
            <a href="login.html">Back to Login</a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reset-password.js"></script>

</body>
</html>
